name: Keepalive Render

# Render free se duerme ~15 min sin tráfico. Este ping cada 10 min lo mantiene despierto
# aunque la PC esté apagada (corre en GitHub Actions).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          set -e
          URL="${RENDER_URL:-https://epopeyasargentinas.onrender.com}"
          URL="${URL%/}/health"
          echo "GET $URL"
          # Reintentos: el cold start de Render a veces tarda
          for i in 1 2 3; do
            if curl -fsS --max-time 60 "$URL"; then
              echo
              exit 0
            fi
            echo "intento $i falló; espero 20s..."
            sleep 20
          done
          exit 1
