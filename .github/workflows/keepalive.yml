name: Keepalive Render

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          set -e
          URL="${RENDER_URL:-https://epopeyas-argentinas.onrender.com}"
          URL="${URL%/}/health"
          echo "GET $URL"
          curl -fsS --max-time 30 "$URL"
          echo
