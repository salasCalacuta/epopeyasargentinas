services:
  - type: web
    name: epopeyas-argentinas
    runtime: node
    rootDir: web
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_ENABLED
        value: "0"
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
